# Security: Store tokens in environment variables (RAGSTAR_GITHUB_TOKEN, RAGSTAR_ADMIN_TOKEN)
# rather than in this file to avoid committing secrets to version control.
ollama_url: http://ollama:11434/api/generate
ollama_model_name: mistral
ollama_embedding_model_name: nomic-embed-text
ollama_context_window: 4096  # Optimized from 8192 for faster response times
ollama_fallback_timeout: 5
chroma_db_path: ./ragstar_db
github_token: ""
admin_token: ""
# OpenAI: generation fallback only
openai_base_url: https://api.openai.com/v1
openai_model_name: gpt-4o-mini
openai_timeout: 30
# Fireworks: embedding fallback (same nomic-embed-text model as Ollama for semantic compatibility)
fireworks_base_url: https://api.fireworks.ai/inference/v1
fireworks_embedding_model_name: nomic-ai/nomic-embed-text-v1.5
fireworks_embedding_dimensions: 768
fireworks_timeout: 30
